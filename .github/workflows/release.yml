name: release

# Cut a release of the catapulte binary. The next version is derived from the
# conventional commits since the last `vX.Y.Z` tag (see cliff.toml + CONTRIBUTING.md):
# breaking -> major, feat -> minor, everything else -> patch. Nothing is published
# to crates.io; the release commit lands on main through a release PR, then the
# tag, GitHub release and Docker image are made from the merged commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (X.Y.Z) to release. Leave empty to derive it from commits. Use this for the first release (2.0.0)."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Covers waiting for the release PR's required checks.
    timeout-minutes: 120
    outputs:
      release: ${{ steps.ver.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Determine next version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="$(git cliff --bumped-version)"
          fi
          VER="${VER#v}"
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          if [ "v$VER" = "$LAST" ]; then
            echo "No release needed: computed v$VER equals latest tag $LAST."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Bump workspace version
        if: steps.ver.outputs.release == 'true'
        run: |
          perl -0777 -i -pe 's/(\[workspace\.package\]\nversion = ")[^"]+(")/${1}${{ steps.ver.outputs.version }}${2}/' Cargo.toml
          cargo update --workspace --quiet

      - name: Update changelog and release notes
        if: steps.ver.outputs.release == 'true'
        run: |
          git cliff --tag "${{ steps.ver.outputs.tag }}" -o CHANGELOG.md
          git cliff --unreleased --tag "${{ steps.ver.outputs.tag }}" --strip header -o RELEASE_NOTES.md

      # main requires signed commits and passing checks, so the release commit
      # lands through a squash-merged PR (GitHub signs the squash commit).
      - name: Open release PR
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          BRANCH="release/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -s -m "chore(release): $TAG"
          git push --force origin "$BRANCH"
          gh pr view "$BRANCH" --json number >/dev/null 2>&1 \
            || gh pr create --base main --head "$BRANCH" --title "chore(release): $TAG" --body-file RELEASE_NOTES.md
          # Events from GITHUB_TOKEN start no workflow runs except workflow_dispatch.
          gh workflow run pre-pr.yml --ref "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash

      - name: Wait for the release PR to merge
        id: merge
        if: steps.ver.outputs.release == 'true'
        env:
          BRANCH: release/${{ steps.ver.outputs.tag }}
          # The changelog was computed on this commit; a commit landing after it
          # would sit under the new tag but outside its changelog section.
          BASE: ${{ github.sha }}
        run: |
          while :; do
            # Read main before the PR state, so a move seen on an open PR is not its own merge.
            MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
            STATE="$(gh pr view "$BRANCH" --json state --jq .state)"
            case "$STATE" in
              MERGED) break ;;
              CLOSED) echo "::error::release PR closed without merging"; exit 1 ;;
            esac
            if [ "$MAIN" != "$BASE" ]; then
              gh pr close "$BRANCH" --delete-branch
              echo "::error::main moved since the release started ($BASE -> $MAIN); release PR closed, rerun the release"
              exit 1
            fi
            # Errors before required checks are reported; empty means none failed yet.
            FAILED="$(gh pr checks "$BRANCH" --required --json name,bucket \
              --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' || true)"
            if [ -n "$FAILED" ]; then
              # Keep a later rerun of the check from merging a release that has no tag.
              gh pr merge "$BRANCH" --disable-auto || true
              echo "::error::release PR checks failed: $FAILED"
              exit 1
            fi
            sleep 30
          done
          SHA="$(gh pr view "$BRANCH" --json mergeCommit --jq .mergeCommit.oid)"
          git push origin --delete "$BRANCH" || true
          git fetch -q origin "$SHA"
          if [ "$(git rev-parse "$SHA^")" != "$BASE" ]; then
            echo "::error::a commit landed on main before the release commit; not tagging, rerun the release"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The tag is created only now, on the squash commit that is on main.
      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "${{ steps.merge.outputs.sha }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md

  # A tag created with GITHUB_TOKEN does not trigger docker.yml, so call it.
  docker:
    needs: release
    if: needs.release.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ needs.release.outputs.sha }}
