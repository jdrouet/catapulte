# Local use only, do not deploy as is. The default S3 secret is for development;
# set MINIO_ROOT_PASSWORD to override it. Ports bind to loopback. The services keep
# their old "minio" names; the object store is RustFS, an S3-compatible server.
services:
  catapulte:
    build:
      context: ..
    ports:
      - "3000:3000"
    environment:
      - "CATAPULTE_HTTP_ADDRESS=0.0.0.0:3000"
      - "CATAPULTE_STORAGE_BACKEND=sqlite"
      - "CATAPULTE_SQLITE_URL=:memory:"
      - "CATAPULTE_QUEUE_BACKEND=storage"
      - "CATAPULTE_SENDERS=mailpit"
      - "CATAPULTE_SENDER_MAILPIT_HOST=mailpit"
      - "CATAPULTE_SENDER_MAILPIT_PORT=1025"
      - "CATAPULTE_SENDER_MAILPIT_TLS=none"
      - "CATAPULTE_ATTACHMENT_BACKEND=s3"
      - "CATAPULTE_ATTACHMENT_S3_ENDPOINT=http://minio:9000"
      - "CATAPULTE_ATTACHMENT_S3_REGION=us-east-1"
      - "CATAPULTE_ATTACHMENT_S3_BUCKET=catapulte"
      - "CATAPULTE_ATTACHMENT_S3_ACCESS_KEY_ID=catapulte"
      - "CATAPULTE_ATTACHMENT_S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-catapulte}"
      - "CATAPULTE_ATTACHMENT_S3_PATH_STYLE=true"
    healthcheck:
      test: ["CMD", "catapulte", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  minio:
    image: rustfs/rustfs:1.0.5
    command: ["/data"]
    environment:
      - "RUSTFS_ACCESS_KEY=catapulte"
      - "RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD:-catapulte}"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  minio-init:
    image: amazon/aws-cli:2.40.0
    environment:
      - "AWS_ACCESS_KEY_ID=catapulte"
      - "AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-catapulte}"
      - "AWS_DEFAULT_REGION=us-east-1"
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket catapulte 2>/dev/null ||
        aws --endpoint-url http://minio:9000 s3 mb s3://catapulte
      "
    depends_on:
      minio:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  minio_data:
